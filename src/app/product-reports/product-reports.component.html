<mat-card class="report-card">

    <mat-card-header>

        <mat-card-title>

            <mat-icon color="primary">

                assessment

            </mat-icon>

            Reports

        </mat-card-title>

    </mat-card-header>

    <mat-card-content>

        <h3>

            Product Reports

        </h3>

        <p>

            Download the latest product report in PDF format.

        </p>

        <button
            mat-raised-button
            color="warn"
            (click)="downloadPdf()">

            <mat-icon>

                picture_as_pdf

            </mat-icon>

            Download Product Report PDF

        </button>

    </mat-card-content>

</mat-card>
