<mat-sidenav-container class="layout-container">

  <!-- Sidebar -->
  <mat-sidenav #drawer mode="side" opened class="sidebar">

    <mat-toolbar color="primary" class="logo">
      🏠 InventoryPro
    </mat-toolbar>

    <mat-nav-list>

      <a mat-list-item routerLink="/Dashboard" routerLinkActive="active-link">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a mat-list-item routerLink="api/Product" routerLinkActive="active-link">
        <mat-icon>inventory_2</mat-icon>
        <span>Products</span>
      </a>

      <a mat-list-item routerLink="api/Category" routerLinkActive="active-link">
        <mat-icon>category</mat-icon>
        <span>Categories</span>
      </a>

      <a mat-list-item routerLink="api/Supplier" routerLinkActive="active-link">
        <mat-icon>local_shipping</mat-icon>
        <span>Suppliers</span>
      </a>

      <a mat-list-item routerLink="api/Customer" routerLinkActive="active-link">
        <mat-icon>groups</mat-icon>
        <span>Customers</span>
      </a>

      <a mat-list-item routerLink="api/Sale" routerLinkActive="active-link">
        <mat-icon>shopping_cart</mat-icon>
        <span>Sales</span>
      </a>

      <a mat-list-item routerLink="api/Chat" routerLinkActive="active-link">
        <mat-icon>smart_toy</mat-icon>
        <span>AI Assistant</span>
      </a>

      <a mat-list-item routerLink="api/Reports" routerLinkActive="active-link">
        <mat-icon>description</mat-icon>
        <span>Reports</span>
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <!-- Main Area -->
  <mat-sidenav-content>

    <!-- Toolbar -->
    <mat-toolbar color="primary" class="toolbar">

      <button mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="title">InventoryPro</span>

      <span class="spacer"></span>
  <div class="search-box">
  <mat-icon>search</mat-icon>
  <input
    type="text"
    placeholder="Search..."
    [(ngModel)]="searchText">
</div>
      <button mat-icon-button>
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-button [matMenuTriggerFor]="menu">
        <mat-icon>account_circle</mat-icon>
        {{userName}}
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          Profile
        </button>

        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          Logout
        </button>
      </mat-menu>

    </mat-toolbar>

    <!-- Content -->
    <div class="content">

      <router-outlet></router-outlet>

    </div>

    <!-- Footer -->
    <footer class="footer">
      © {{ currentDateTime | date:'dd-MMM-yyyy hh:mm:ss a' }}
     | InventoryPro v1.0
    </footer>

  </mat-sidenav-content>

</mat-sidenav-container>
